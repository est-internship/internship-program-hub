<title>EST Internship Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:#263593;color:#263593;font-family:'Poppins',system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;padding:24px}
.card{background:#f4f5fb;border-radius:28px;padding:36px 32px;grid-template-columns:minmax(0,1fr);max-width:440px;width:100%;min-width:0;display:grid;gap:16px;box-shadow:0 18px 40px rgba(0,0,0,.35);border-top:10px solid #f6b044}
.logo{height:56px;width:auto;justify-self:start;background:#263593;border-radius:12px;padding:6px 10px}
h1{font-size:28px;font-weight:800;text-transform:uppercase;line-height:1.1}
p{font-size:15px;font-weight:500;line-height:1.5}
label{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;margin-top:6px} form{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)} .card p,.card h1{overflow-wrap:anywhere}
input{flex:1;min-width:0;font:inherit;font-weight:600;padding:14px 16px;border-radius:14px;border:3px solid #75b9e5;background:#fff;color:#263593}
input:focus{outline:none;border-color:#f6b044}
button{font:inherit;font-weight:800;text-transform:uppercase;border:0;border-radius:999px;padding:14px 22px;background:#f6b044;color:#263593;cursor:pointer}
button:hover{filter:brightness(1.05)} button:focus-visible{outline:3px solid #263593;outline-offset:2px}
button.ghost{background:#dfe3f6;padding:14px 16px;font-size:12px}
#err{color:#b3261e;font-weight:700;font-size:14px;min-height:20px}
.foot{font-size:12px;font-weight:500;opacity:.8}
</style></head><body>

async function open_(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(S),iterations:250000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(I)},k,b(C));
  return new TextDecoder().decode(p);
}
function show(html){document.open();document.write(html);document.close();}
const $=id=>document.getElementById(id);
$('eye').onclick=()=>{const t=$('pw').type==='password';$('pw').type=t?'text':'password';$('eye').textContent=t?'Hide':'Show'};
const LK='est-sh-lock',MAXTRY=3;
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function readLk(){try{const v=JSON.parse(localStorage.getItem(LK)||'null');if(v&&v.day===today())return v}catch(_){}return{day:today(),n:0,until:0}}
function writeLk(v){try{localStorage.setItem(LK,JSON.stringify(v))}catch(_){}}
function nextMidnight(){const d=new Date();d.setHours(24,0,0,0);return d.getTime()}
function isLocked(){const v=readLk();return v.until>Date.now()}
function showLocked(){$('err').textContent='Too many wrong attempts. This page is locked until tomorrow. Ask your Internship Facilitator if you need help.';$('pw').disabled=true;$('go').disabled=true;$('eye').disabled=true;$('go').textContent='Locked'}
$('f').onsubmit=async e=>{e.preventDefault();if(isLocked()){showLocked();return}$('err').textContent='';$('go').disabled=true;$('go').textContent='Checking…';
  try{const h=await open_($('pw').value.trim());writeLk({day:today(),n:0,until:0});try{sessionStorage.setItem('est-sh',$('pw').value.trim())}catch(_){}show(h)}
